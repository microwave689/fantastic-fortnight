<script>(function(){
var P=JSON.parse(document.getElementById("payload").textContent),K="dm-site-key",S=crypto.subtle;
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function show(html){function go(){document.open();document.write(html);document.close()}if(document.readyState==="complete")go();else window.addEventListener("load",go,{once:true})}
function dec(key){return S.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct)).then(function(pt){return new TextDecoder().decode(pt)})}
var f=document.getElementById("f"),p=document.getElementById("p"),r=document.getElementById("r"),bt=document.getElementById("b"),er=document.getElementById("e");
function ask(){f.hidden=false;p.focus()}
var saved=null;try{saved=localStorage.getItem(K)}catch(x){}
if(saved){S.importKey("raw",b(saved),"AES-GCM",false,["decrypt"]).then(dec).then(show).catch(function(){try{localStorage.removeItem(K)}catch(x){}ask()})}else ask();
f.addEventListener("submit",function(ev){ev.preventDefault();bt.disabled=true;bt.textContent="Открываю…";er.hidden=true;var key;
S.importKey("raw",new TextEncoder().encode(p.value),"PBKDF2",false,["deriveKey"]).then(function(base){
return S.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])})
.then(function(k){key=k;return dec(k)}).then(function(html){
if(!r.checked){show(html);return}
return S.exportKey("raw",key).then(function(raw){var u=new Uint8Array(raw),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);try{localStorage.setItem(K,btoa(s))}catch(x){}show(html)})
}).catch(function(){bt.disabled=false;bt.textContent="Открыть";er.hidden=false;p.select()})});
})();</script></body></html>
